<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBE System - Students</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .table-container { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { color: var(--text-secondary); font-size: 0.875rem; font-weight: 500; text-transform: uppercase; }
        .badge { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; }
        .badge-active { background: #d1fae5; color: #065f46; }
        .badge-inactive { background: #fee2e2; color: #991b1b; }
    </style>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="images/logo.png" alt="Chitkara University" style="max-height: 40px; width: auto;">
            </div>
            
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i> Dashboard
                </a>
                <a href="master-upload.html" class="nav-item">
                    <i data-lucide="upload-cloud"></i> Master Upload
                </a>
                <a href="colleges.html" class="nav-item">
                    <i data-lucide="building-2"></i> Colleges
                </a>
                <a href="programs.html" class="nav-item">
                    <i data-lucide="graduation-cap"></i> Programs
                </a>
                <a href="batches.html" class="nav-item">
                    <i data-lucide="calendar-days"></i> Batches
                </a>
                <a href="courses.html" class="nav-item">
                    <i data-lucide="book"></i> Courses
                </a>
                <a href="students.html" class="nav-item active">
                    <i data-lucide="users"></i> Students
                </a>
                <a href="enrollments.html" class="nav-item">
                    <i data-lucide="user-plus"></i> Enrollments
                </a>
                <a href="assessments.html" class="nav-item">
                    <i data-lucide="clipboard-list"></i> Assessments
                </a>
                <a href="attainments.html" class="nav-item">
                    <i data-lucide="bar-chart-2"></i> Course Attainments
                </a>
                <a href="program-attainments.html" class="nav-item">
                    <i data-lucide="bar-chart"></i> Program Attainments
                </a>
                <a href="co-po.html" class="nav-item">
                    <i data-lucide="network"></i> CO/PO Mapping
                </a>
            </nav>

            
            <div style="margin-top: auto; padding: 1rem 0;">
                <button class="btn btn-secondary" style="width: 100%; justify-content: flex-start; gap: 0.5rem;" onclick="logout()">
                    <i data-lucide="log-out"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <div>
                    <h1 class="animate-fade-in text-gradient">Students</h1>
                    <p style="color: var(--text-secondary)" class="animate-fade-in">Manage and view student enrollments from PostgreSQL.</p>
                </div>
                <a href="add-student.html" class="btn btn-primary animate-fade-in">
                    <i data-lucide="plus"></i> Add Student
                </a>
            </header>

            <div class="card animate-fade-in" style="animation-delay: 0.1s">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Roll No</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Program</th>
                                <th>Batch / Section</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="studentTableBody">
                            <tr><td colspan="6" style="text-align: center; color: var(--text-secondary)">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Student Modal -->
    <script src="js/app.js"></script>
    <script>
        lucide.createIcons();

        async function fetchStudents() {
            const res = await apiCall('students.php');
            const tbody = document.getElementById('studentTableBody');
            
            if (res.success && res.data) {
                if (res.data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--text-secondary)">No students found in database.</td></tr>`;
                    return;
                }
                tbody.innerHTML = res.data.map(s => `
                    <tr>
                        <td><strong>${s.roll_no}</strong></td>
                        <td>${s.name}</td>
                        <td>${s.email || '-'}</td>
                        <td>${s.program_name || 'N/A'}</td>
                        <td>${s.batch_name || '-'} / ${s.section_name || '-'}</td>
                        <td><span class="badge ${s.isActive ? 'badge-active' : 'badge-inactive'}">${s.isActive ? 'Active' : 'Inactive'}</span></td>
                        <td>
                            <button class="btn btn-secondary" style="padding: 0.25rem 0.5rem;" onclick="deleteStudent('${s.id}')">
                                <i data-lucide="trash-2" style="width:14px; color: var(--danger)"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
                lucide.createIcons();
            } else {
                tbody.innerHTML = `<tr><td colspan="7" style="color:var(--danger)">Failed to load students: ${res.message || 'Unknown error'}</td></tr>`;
            }
        }

        async function populateDropdowns() {
            const [cRes, pRes, bRes] = await Promise.all([
                apiCall('colleges.php'), apiCall('programs.php'), apiCall('batches.php')
            ]);
            
            if (cRes.success) {
                const s = document.getElementById('sCollege');
                cRes.data.forEach(x => { const o = document.createElement('option'); o.value = x.id || x._id; o.textContent = x.name; s.appendChild(o); });
            }
            if (pRes.success) {
                const s = document.getElementById('sProgram');
                pRes.data.forEach(x => { const o = document.createElement('option'); o.value = x.id; o.textContent = x.name; s.appendChild(o); });
            }
            if (bRes.success) {
                const s = document.getElementById('sBatch');
                bRes.data.forEach(x => { const o = document.createElement('option'); o.value = x.id; o.textContent = x.name; s.appendChild(o); });
            }
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        async function handleAddStudent(e) {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.innerHTML = 'Saving...'; btn.disabled = true;

            const res = await apiCall('students.php', {
                method: 'POST',
                body: JSON.stringify({
                    studentId: document.getElementById('sRoll').value,
                    name: document.getElementById('sName').value,
                    email: document.getElementById('sEmail').value || null,
                    collegeId: document.getElementById('sCollege').value,
                    programId: document.getElementById('sProgram').value,
                    batchId: document.getElementById('sBatch').value
                })
            });

            if (res.success) {
                closeModal('addStudentModal');
                fetchStudents();
                document.getElementById('addStudentForm').reset();
            } else {
                showToast(res.message);
            }
            btn.innerHTML = 'Save'; btn.disabled = false;
        }

        async function deleteStudent(id) {
            if(confirm('Are you sure you want to delete this student?')) {
                await apiCall(`students.php?id=${id}`, { method: 'DELETE' });
                fetchStudents();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchStudents();
            populateDropdowns();
        });
    </script>
</body>
</html>
