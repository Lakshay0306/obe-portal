<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBE System - Assessments</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .table-container { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { color: var(--text-secondary); font-size: 0.875rem; font-weight: 500; text-transform: uppercase; }
        .badge { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; }
        .badge-active { background: #d1fae5; color: #065f46; }
        .badge-inactive { background: #fee2e2; color: #991b1b; }
        .badge-type { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
    </style>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="images/logo.png" alt="Chitkara University" style="max-height: 40px; width: auto;">
            </div>
            
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i> Dashboard
                </a>
                <a href="master-upload.html" class="nav-item">
                    <i data-lucide="upload-cloud"></i> Master Upload
                </a>
                <a href="colleges.html" class="nav-item">
                    <i data-lucide="building-2"></i> Colleges
                </a>
                <a href="programs.html" class="nav-item">
                    <i data-lucide="graduation-cap"></i> Programs
                </a>
                <a href="batches.html" class="nav-item">
                    <i data-lucide="calendar-days"></i> Batches
                </a>
                <a href="courses.html" class="nav-item">
                    <i data-lucide="book"></i> Courses
                </a>
                <a href="students.html" class="nav-item">
                    <i data-lucide="users"></i> Students
                </a>
                <a href="enrollments.html" class="nav-item">
                    <i data-lucide="user-plus"></i> Enrollments
                </a>
                <a href="assessments.html" class="nav-item active">
                    <i data-lucide="clipboard-list"></i> Assessments
                </a>
                <a href="attainments.html" class="nav-item">
                    <i data-lucide="bar-chart-2"></i> Attainments
                </a>
                <a href="co-po.html" class="nav-item">
                    <i data-lucide="network"></i> CO/PO Mapping
                </a>
            </nav>

            
            <div style="margin-top: auto; padding: 1rem 0;">
                <button class="btn btn-secondary" style="width: 100%; justify-content: flex-start; gap: 0.5rem;" onclick="logout()">
                    <i data-lucide="log-out"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <div>
                    <h1 class="animate-fade-in text-gradient">Assessments</h1>
                    <p style="color: var(--text-secondary)" class="animate-fade-in">Manage exams, assignments, and their marks.</p>
                </div>
                <div style="display: flex; gap: 1rem; align-items: center;" class="animate-fade-in">
                    <select id="topManageSelect" class="input-field" style="width: 250px;">
                        <option value="">Select Assessment to Manage...</option>
                    </select>
                    <button class="btn btn-secondary" onclick="manageSelectedAssessment()">
                        <i data-lucide="settings"></i> Manage
                    </button>
                    <a href="add-assessment.html" class="btn btn-primary">
                        <i data-lucide="plus"></i> Add Assessment
                    </a>
                </div>
            </header>

            <div class="card animate-fade-in" style="animation-delay: 0.1s">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Type</th>
                                <th>Course</th>
                                <th>Section</th>
                                <th>Max Marks</th>
                                <th>Weightage</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="assessmentTableBody">
                            <tr><td colspan="8" style="text-align: center; color: var(--text-secondary)">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script>
        lucide.createIcons();

        function manageSelectedAssessment() {
            const select = document.getElementById('topManageSelect');
            if (select.value) {
                window.location.href = 'assessment-dashboard.html?id=' + select.value;
            } else {
                showToast('Please select an assessment to manage first!', 'error');
            }
        }

        async function fetchAssessments() {
            const res = await apiCall('assessments.php');
            const tbody = document.getElementById('assessmentTableBody');
            const topSelect = document.getElementById('topManageSelect');
            
            if (res.success && res.data) {
                if (res.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: var(--text-secondary)">No assessments found in database.</td></tr>';
                    return;
                }
                
                // Populate the top dropdown
                topSelect.innerHTML = '<option value="">Select Assessment to Manage...</option>' + 
                    res.data.map(a => `<option value="${a.id}">${a.name} (${a.course_code || 'N/A'})</option>`).join('');

                // Populate table
                tbody.innerHTML = res.data.map(a => `
                    <tr>
                        <td><strong>${a.name}</strong></td>
                        <td><span class="badge badge-type">${a.type}</span></td>
                        <td>${a.course_code ? a.course_code + ' - ' + a.course_name : 'N/A'}</td>
                        <td>${a.section_name || 'All Sections'}</td>
                        <td>${a.maxMarks}</td>
                        <td>${a.weightage}%</td>
                        <td><span class="badge ${a.isActive ? 'badge-active' : 'badge-inactive'}">${a.isActive ? 'Active' : 'Inactive'}</span></td>
                        <td>
                            <a href="assessment-dashboard.html?id=${a.id}" class="btn btn-secondary" style="padding: 0.25rem 0.5rem; margin-right: 0.5rem;" title="Manage Assessment">
                                <i data-lucide="settings" style="width:14px;"></i>
                            </a>
                            <button class="btn btn-secondary" style="padding: 0.25rem 0.5rem;" onclick="deleteAssessment('${a.id}')">
                                <i data-lucide="trash-2" style="width:14px; color: var(--danger)"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
                lucide.createIcons();
            } else {
                tbody.innerHTML = '<tr><td colspan="8" style="color:var(--danger)">Failed to load assessments: ' + (res.message || 'Unknown error') + '</td></tr>';
            }
        }

        async function deleteAssessment(id) {
            if(confirm('Are you sure you want to delete this assessment?')) {
                await apiCall('assessments.php?id=' + id, { method: 'DELETE' });
                fetchAssessments();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchAssessments();
        });
    </script>
</body>
</html>
