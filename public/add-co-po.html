<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBE System - Add CO-PO Mapping</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .table-container { width: 100%; overflow-x: auto; margin-top: 1.5rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 1rem; text-align: center; border: 1px solid var(--border-color); }
        th { background: var(--bg-secondary); color: var(--text-secondary); font-size: 0.875rem; font-weight: 600; }
        td:first-child { text-align: left; font-weight: 500; background: var(--bg-secondary); }
        .level-1 { background-color: #fee2e2; color: #991b1b; font-weight: bold; }
        .level-2 { background-color: #fef08a; color: #854d0e; font-weight: bold; }
        .level-3 { background-color: #d1fae5; color: #065f46; font-weight: bold; }
        .empty-cell { color: var(--text-secondary); font-size: 0.8rem; }
    </style>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="images/logo.png" alt="Chitkara University" style="max-height: 40px; width: auto;">
            </div>
            
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i> Dashboard
                </a>
                <a href="master-upload.html" class="nav-item">
                    <i data-lucide="upload-cloud"></i> Master Upload
                </a>
                <a href="colleges.html" class="nav-item">
                    <i data-lucide="building-2"></i> Colleges
                </a>
                <a href="programs.html" class="nav-item">
                    <i data-lucide="graduation-cap"></i> Programs
                </a>
                <a href="batches.html" class="nav-item">
                    <i data-lucide="calendar-days"></i> Batches
                </a>
                <a href="courses.html" class="nav-item">
                    <i data-lucide="book"></i> Courses
                </a>
                <a href="students.html" class="nav-item">
                    <i data-lucide="users"></i> Students
                </a>
                <a href="enrollments.html" class="nav-item">
                    <i data-lucide="user-plus"></i> Enrollments
                </a>
                <a href="assessments.html" class="nav-item">
                    <i data-lucide="clipboard-list"></i> Assessments
                </a>
                <a href="attainments.html" class="nav-item">
                    <i data-lucide="bar-chart-2"></i> Course Attainments
                </a>
                <a href="program-attainments.html" class="nav-item">
                    <i data-lucide="bar-chart"></i> Program Attainments
                </a>
                <a href="co-po.html" class="nav-item">
                    <i data-lucide="network"></i> CO/PO Mapping
                </a>
            </nav>

            
            <div style="margin-top: auto; padding: 1rem 0;">
                <button class="btn btn-secondary" style="width: 100%; justify-content: flex-start; gap: 0.5rem;" onclick="logout()">
                    <i data-lucide="log-out"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <div>
                    <h1 class="animate-fade-in text-gradient">Add CO-PO Mapping</h1>
                    <p style="color: var(--text-secondary)" class="animate-fade-in">Fill out the form below to add a new record.</p>
                </div>
                <a href="co-po.html" class="btn btn-secondary animate-fade-in">
                    <i data-lucide="arrow-left"></i> Back
                </a>
            </header>

            <div class="card animate-fade-in" style="animation-delay: 0.1s; ">
                <form id="addMappingForm" onsubmit="handleAddMapping(event)">

                <div class="form-group">
                    <label class="input-label">Course</label>
                    <select id="mapCourse" class="input-field" required onchange="loadCOsAndPOsForMapping()">
                        <option value="">Select Course...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="input-label">CO (Course Outcome)</label>
                    <select id="mapCO" class="input-field" required>
                        <option value="">Select CO...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="input-label">PO (Program Outcome)</label>
                    <select id="mapPO" class="input-field" required>
                        <option value="">Select PO...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="input-label">Mapping Level</label>
                    <select id="mapLevel" class="input-field" required>
                        <option value="1">1 - Low</option>
                        <option value="2">2 - Medium</option>
                        <option value="3">3 - High</option>
                    </select>
                </div>
                <div class="form-actions">
                    
                    <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
                </div>
            
</form>
            </div>
        </main>
    </div>

    <!-- Add Mapping Modal -->
    <script src="js/app.js"></script>
    <script>
        lucide.createIcons();

        let globalCourses = [];
        let globalCOs = [];
        let globalPOs = [];

        async function init() {
            const [matrixRes, coRes, poRes] = await Promise.all([
                apiCall('co_po.php'),
                apiCall('co.php'),
                apiCall('po.php')
            ]);
            
            if (coRes.success) globalCOs = coRes.data;
            if (poRes.success) globalPOs = poRes.data;

            if (matrixRes.success && matrixRes.data && matrixRes.data.courses) {
                globalCourses = matrixRes.data.courses;
                const select1 = document.getElementById('courseSelect');
                const select2 = document.getElementById('mapCourse');
                
                globalCourses.forEach(c => {
                    const optText = `${c.code} - ${c.name}`;
                    const opt1 = document.createElement('option'); opt1.value = c.id; opt1.textContent = optText; select1.appendChild(opt1);
                    const opt2 = document.createElement('option'); opt2.value = c.id; opt2.textContent = optText; select2.appendChild(opt2);
                });
            }
        }

        async function loadMatrix() {
            const courseId = document.getElementById('courseSelect').value;
            const container = document.getElementById('matrixContainer');
            const loading = document.getElementById('loadingMsg');
            const noData = document.getElementById('noDataMsg');
            
            container.style.display = 'none';
            noData.style.display = 'none';

            if (!courseId) return;

            loading.style.display = 'block';
            
            const res = await apiCall(`co_po.php?course_id=${courseId}`);
            loading.style.display = 'none';

            if (res.success && res.data && res.data.selectedCourse) {
                const data = res.data.selectedCourse;
                if (!data.pos || !data.cos || data.pos.length === 0 || data.cos.length === 0) {
                    noData.style.display = 'block';
                    return;
                }

                document.getElementById('courseTitle').textContent = `Mapping Matrix for ${data.details.code}`;

                // Build Table Head
                const thead = document.getElementById('matrixHead');
                thead.innerHTML = `<tr><th>CO / PO</th>${data.pos.map(po => `<th title="${po.description}">${po.code}</th>`).join('')}</tr>`;

                // Build Table Body
                const tbody = document.getElementById('matrixBody');
            if (!tbody) return;
                tbody.innerHTML = data.cos.map(co => {
                    let row = `<tr><td title="${co.description}">${co.code}</td>`;
                    data.pos.forEach(po => {
                        // Find mapping level
                        const mapping = data.mappings.find(m => m.coId === co.id && m.poId === po.id);
                        const level = mapping ? mapping.level : '';
                        const lvlClass = level ? `level-${level}` : 'empty-cell';
                        row += `<td class="${lvlClass}">${level || '-'}</td>`;
                    });
                    row += `</tr>`;
                    return row;
                }).join('');

                container.style.display = 'block';
            } else {
                noData.style.display = 'block';
            }
        }

        function openMappingModal() {
            document.getElementById('addMappingModal').classList.add('active');
        }
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function loadCOsAndPOsForMapping() {
            const courseId = document.getElementById('mapCourse').value;
            const coSelect = document.getElementById('mapCO');
            const poSelect = document.getElementById('mapPO');
            
            coSelect.innerHTML = '<option value="">Select CO...</option>';
            poSelect.innerHTML = '<option value="">Select PO...</option>';
            
            if(!courseId) return;

            const courseCOs = globalCOs.filter(co => co.course_code === globalCourses.find(c => c.id === courseId)?.code || true); // Simplification for now, usually we filter by exact courseId if the API returns it
            
            // To properly filter COs, let's just show all for the selected course code
            const selectedCourseCode = globalCourses.find(c => c.id === courseId)?.code;
            const filteredCOs = globalCOs.filter(co => co.course_code === selectedCourseCode);
            filteredCOs.forEach(co => {
                const opt = document.createElement('option'); opt.value = co.id; opt.textContent = `${co.code}: ${co.description.substring(0, 50)}...`; coSelect.appendChild(opt);
            });

            // Show all POs for now
            globalPOs.forEach(po => {
                const opt = document.createElement('option'); opt.value = po.id; opt.textContent = `${po.program_name} - ${po.code}`; poSelect.appendChild(opt);
            });
        }

        async function handleAddMapping(e) {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.innerHTML = 'Saving...'; btn.disabled = true;

            const res = await apiCall('copo_mappings.php', {
                method: 'POST',
                body: JSON.stringify({
                    courseId: document.getElementById('mapCourse').value,
                    coId: document.getElementById('mapCO').value,
                    poId: document.getElementById('mapPO').value,
                    level: parseInt(document.getElementById('mapLevel').value)
            if (!tbody) return;
                tbody.innerHTML = data.cos.map(co => {
                    let row = `<tr><td title="${co.description}">${co.code}</td>`;
                    data.pos.forEach(po => {
                        // Find mapping level
                        const mapping = data.mappings.find(m => m.coId === co.id && m.poId === po.id);
                        const level = mapping ? mapping.level : '';
                        const lvlClass = level ? `level-${level}` : 'empty-cell';
                        row += `<td class="${lvlClass}">${level || '-'}</td>`;
                    });
                    row += `</tr>`;
                    return row;
                }).join('');

                container.style.display = 'block';
            } else {
                noData.style.display = 'block';
            }
        }

        function openMappingModal() {
            document.getElementById('addMappingModal').classList.add('active');
        }
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function loadCOsAndPOsForMapping() {
            const courseId = document.getElementById('mapCourse').value;
            const coSelect = document.getElementById('mapCO');
            const poSelect = document.getElementById('mapPO');
            
            coSelect.innerHTML = '<option value="">Select CO...</option>';
            poSelect.innerHTML = '<option value="">Select PO...</option>';
            
            if(!courseId) return;

            const courseCOs = globalCOs.filter(co => co.course_code === globalCourses.find(c => c.id === courseId)?.code || true); // Simplification for now, usually we filter by exact courseId if the API returns it
            
            // To properly filter COs, let's just show all for the selected course code
            const selectedCourseCode = globalCourses.find(c => c.id === courseId)?.code;
            const filteredCOs = globalCOs.filter(co => co.course_code === selectedCourseCode);
            filteredCOs.forEach(co => {
                const opt = document.createElement('option'); opt.value = co.id; opt.textContent = `${co.code}: ${co.description.substring(0, 50)}...`; coSelect.appendChild(opt);
            });

            // Show all POs for now
            globalPOs.forEach(po => {
                const opt = document.createElement('option'); opt.value = po.id; opt.textContent = `${po.program_name} - ${po.code}`; poSelect.appendChild(opt);
            });
        }

        async function handleAddMapping(e) {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.innerHTML = 'Saving...'; btn.disabled = true;

            const res = await apiCall('copo_mappings.php', {
                method: 'POST',
                body: JSON.stringify({
                    courseId: document.getElementById('mapCourse').value,
                    coId: document.getElementById('mapCO').value,
                    poId: document.getElementById('mapPO').value,
                    level: parseInt(document.getElementById('mapLevel').value)
                })
            });

            if (res.success) {
                window.location.href = 'co-po.html';
            } else {
                showToast(res.message);
            }
            btn.innerHTML = 'Save'; btn.disabled = false;
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
