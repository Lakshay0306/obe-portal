<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBE System - Question Paper</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .paper-container {
            
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        .paper-header {
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
        }
        .university-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .assessment-details {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        .question-item {
            display: flex;
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
        }
        .q-number {
            font-weight: 600;
            margin-right: 1rem;
            min-width: 30px;
        }
        .q-text {
            flex-grow: 1;
        }
        .q-meta {
            text-align: right;
            min-width: 100px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .co-tag {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: normal;
        }
        
        /* Print Styles */
        @media print {
            body { background: white; }
            .sidebar, .print-hide { display: none !important; }
            .main-content { margin-left: 0 !important; padding: 0 !important; }
            .paper-container { box-shadow: none; padding: 0; max-width: 100%; margin: 0; }
            .app-container { display: block; }
        }
    </style>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="images/logo.png" alt="Chitkara University" style="max-height: 40px; width: auto;">
            </div>
            
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i> Dashboard
                </a>
                <a href="colleges.html" class="nav-item">
                    <i data-lucide="building-2"></i> Colleges
                </a>
                <a href="programs.html" class="nav-item">
                    <i data-lucide="graduation-cap"></i> Programs
                </a>
                <a href="batches.html" class="nav-item">
                    <i data-lucide="calendar-days"></i> Batches
                </a>
                <a href="courses.html" class="nav-item">
                    <i data-lucide="book"></i> Courses
                </a>
                <a href="students.html" class="nav-item">
                    <i data-lucide="users"></i> Students
                </a>
                <a href="enrollments.html" class="nav-item">
                    <i data-lucide="user-plus"></i> Enrollments
                </a>
                <a href="assessments.html" class="nav-item">
                    <i data-lucide="clipboard-list"></i> Assessments
                </a>
                <a href="attainments.html" class="nav-item">
                    <i data-lucide="bar-chart-2"></i> Attainments
                </a>
                <a href="co-po.html" class="nav-item">
                    <i data-lucide="network"></i> CO/PO Mapping
                </a>
            </nav>

            
            <div style="margin-top: auto; padding: 1rem 0;">
                <button class="btn btn-secondary" style="width: 100%; justify-content: flex-start; gap: 0.5rem;" onclick="logout()">
                    <i data-lucide="log-out"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="print-hide" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <div>
                    <h1 class="animate-fade-in text-gradient">Question Paper</h1>
                    <p style="color: var(--text-secondary)" class="animate-fade-in">Preview and print the assessment.</p>
                </div>
                <div style="display: flex; gap: 1rem;">
                    <button class="btn btn-primary animate-fade-in" onclick="window.print()">
                        <i data-lucide="printer"></i> Print PDF
                    </button>
                    <a href="assessments.html" class="btn btn-secondary animate-fade-in">
                        <i data-lucide="arrow-left"></i> Back
                    </a>
                </div>
            </header>

            <div class="paper-container animate-fade-in" style="animation-delay: 0.1s">
                <div class="paper-header">
                    <div class="university-name">CHITKARA UNIVERSITY</div>
                    <div class="assessment-details">
                        <span id="pCourse">Course: Loading...</span>
                        <span id="pDate">Date: ____________</span>
                    </div>
                    <div class="assessment-details">
                        <span id="pName">Assessment: Loading...</span>
                        <span id="pMarks">Max Marks: Loading...</span>
                    </div>
                </div>

                <div id="questionsContainer">
                    <div style="text-align: center; padding: 2rem; color: var(--text-secondary);">Loading questions...</div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script>
        lucide.createIcons();

        async function loadPaper() {
            const urlParams = new URLSearchParams(window.location.search);
            const aId = urlParams.get('id');
            if(!aId) {
                document.getElementById('questionsContainer').innerHTML = '<div style="color:red;text-align:center;">No assessment ID provided.</div>';
                return;
            }

            const [aRes, qRes] = await Promise.all([
                apiCall('assessments.php'),
                apiCall('questions.php')
            ]);

            if (aRes.success && qRes.success) {
                const assessment = aRes.data.find(a => a.id === aId);
                if(!assessment) {
                    document.getElementById('questionsContainer').innerHTML = '<div style="color:red;text-align:center;">Assessment not found.</div>';
                    return;
                }

                document.getElementById('pCourse').textContent = `Course: ${assessment.course_code || ''} - ${assessment.course_name || ''}`;
                document.getElementById('pName').textContent = `Assessment: ${assessment.name} (${assessment.type})`;
                document.getElementById('pMarks').textContent = `Max Marks: ${assessment.maxMarks}`;

                const questions = qRes.data.filter(q => q.assessment_name === assessment.name);
                
                const container = document.getElementById('questionsContainer');
                
                if (questions.length === 0) {
                    container.innerHTML = '<div style="text-align:center; padding: 2rem;">No questions added to this assessment yet.</div>';
                    return;
                }

                container.innerHTML = questions.map((q, idx) => `
                    <div class="question-item">
                        <div class="q-number">Q${idx + 1}.</div>
                        <div class="q-text">${q.question}</div>
                        <div class="q-meta">
                            <div>[${q.maxMarks}]</div>
                            ${q.mapped_cos ? `<div class="co-tag">(${q.mapped_cos})</div>` : ''}
                        </div>
                    </div>
                `).join('');

            } else {
                document.getElementById('questionsContainer').innerHTML = '<div style="color:red;text-align:center;">Error loading data.</div>';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadPaper();
        });
    </script>
</body>
</html>
