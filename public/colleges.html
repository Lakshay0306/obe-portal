<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBE System - Colleges</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .table-container {
            width: 100%;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        th {
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
        }
        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .badge-active { background: rgba(34, 197, 94, 0.2); color: var(--success); }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        .modal {
            background: var(--bg-secondary);
            padding: 2rem;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 500px;
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="images/logo.png" alt="Chitkara University" style="max-height: 40px; width: auto;">
            </div>
            
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i> Dashboard
                </a>
                <a href="master-upload.html" class="nav-item">
                    <i data-lucide="upload-cloud"></i> Master Upload
                </a>
                <a href="colleges.html" class="nav-item active">
                    <i data-lucide="building-2"></i> Colleges
                </a>
                <a href="programs.html" class="nav-item">
                    <i data-lucide="graduation-cap"></i> Programs
                </a>
                <a href="batches.html" class="nav-item">
                    <i data-lucide="calendar-days"></i> Batches
                </a>
                <a href="courses.html" class="nav-item">
                    <i data-lucide="book"></i> Courses
                </a>
                <a href="students.html" class="nav-item">
                    <i data-lucide="users"></i> Students
                </a>
                <a href="enrollments.html" class="nav-item">
                    <i data-lucide="user-plus"></i> Enrollments
                </a>
                <a href="assessments.html" class="nav-item">
                    <i data-lucide="clipboard-list"></i> Assessments
                </a>
                <a href="attainments.html" class="nav-item">
                    <i data-lucide="bar-chart-2"></i> Course Attainments
                </a>
                <a href="program-attainments.html" class="nav-item">
                    <i data-lucide="bar-chart"></i> Program Attainments
                </a>
                <a href="co-po.html" class="nav-item">
                    <i data-lucide="network"></i> CO/PO Mapping
                </a>
            </nav>
        
            <div style="margin-top: auto; padding: 1rem 0;">
                <button class="btn btn-secondary" style="width: 100%; justify-content: flex-start; gap: 0.5rem;" onclick="logout()">
                    <i data-lucide="log-out"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <div>
                    <h1 class="animate-fade-in text-gradient">Colleges</h1>
                    <p style="color: var(--text-secondary)" class="animate-fade-in">Manage university colleges from PostgreSQL.</p>
                </div>
                <a href="add-college.html" class="btn btn-primary animate-fade-in">
                    <i data-lucide="plus"></i> Add College
                </a>
            </header>

            <div class="card animate-fade-in" style="animation-delay: 0.1s">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Code</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="collegeTableBody">
                            <tr><td colspan="4" style="text-align: center; color: var(--text-secondary)">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Add College Modal -->
    <script src="js/app.js"></script>
    <script>
        lucide.createIcons();

        async function fetchColleges() {
            const res = await apiCall('colleges.php');
            const tbody = document.getElementById('collegeTableBody');
            
            if (res.success && res.data) {
                tbody.innerHTML = res.data.map(c => `
                    <tr>
                        <td><strong>${c.name}</strong></td>
                        <td>${c.code}</td>
                        <td><span class="badge ${c.isActive ? 'badge-active' : ''}">${c.isActive ? 'Active' : 'Inactive'}</span></td>
                        <td>
                            <button class="btn btn-secondary" style="padding: 0.25rem 0.5rem;" onclick="deleteCollege('${c._id}')">
                                <i data-lucide="trash-2" style="width:14px; color: var(--danger)"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
                lucide.createIcons();
            } else {
                tbody.innerHTML = `<tr><td colspan="4" style="color:var(--danger)">Failed to load colleges</td></tr>`;
            }
        }

        function openModal(id) { document.getElementById(id || 'addCollegeModal').classList.add('active'); }
        function closeModal(id) { document.getElementById(id || 'addCollegeModal').classList.remove('active'); }

        async function handleAddCollege(e) {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.innerHTML = 'Saving...'; btn.disabled = true;

            const res = await apiCall('colleges.php', {
                method: 'POST',
                body: JSON.stringify({
                    name: document.getElementById('cName').value,
                    code: document.getElementById('cCode').value
                })
            });

            if (res.success) {
                closeModal('addCollegeModal');
                fetchColleges();
                document.getElementById('addCollegeForm').reset();
            } else {
                showToast(res.message);
            }
            btn.innerHTML = 'Save'; btn.disabled = false;
        }

        async function deleteCollege(id) {
            if(confirm('Are you sure you want to delete this college?')) {
                await apiCall(`colleges.php?id=${id}`, { method: 'DELETE' });
                fetchColleges();
            }
        }

        document.addEventListener('DOMContentLoaded', fetchColleges);
    </script>
</body>
</html>
