<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBE System - Add New Assessment</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .table-container { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { color: var(--text-secondary); font-size: 0.875rem; font-weight: 500; text-transform: uppercase; }
        .badge { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; }
        .badge-active { background: #d1fae5; color: #065f46; }
        .badge-inactive { background: #fee2e2; color: #991b1b; }
        .badge-type { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
    </style>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="images/logo.png" alt="Chitkara University" style="max-height: 40px; width: auto;">
            </div>
            
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i> Dashboard
                </a>
                <a href="master-upload.html" class="nav-item">
                    <i data-lucide="upload-cloud"></i> Master Upload
                </a>
                <a href="colleges.html" class="nav-item">
                    <i data-lucide="building-2"></i> Colleges
                </a>
                <a href="programs.html" class="nav-item">
                    <i data-lucide="graduation-cap"></i> Programs
                </a>
                <a href="batches.html" class="nav-item">
                    <i data-lucide="calendar-days"></i> Batches
                </a>
                <a href="courses.html" class="nav-item">
                    <i data-lucide="book"></i> Courses
                </a>
                <a href="students.html" class="nav-item">
                    <i data-lucide="users"></i> Students
                </a>
                <a href="enrollments.html" class="nav-item">
                    <i data-lucide="user-plus"></i> Enrollments
                </a>
                <a href="assessments.html" class="nav-item">
                    <i data-lucide="clipboard-list"></i> Assessments
                </a>
                <a href="attainments.html" class="nav-item">
                    <i data-lucide="bar-chart-2"></i> Course Attainments
                </a>
                <a href="program-attainments.html" class="nav-item">
                    <i data-lucide="bar-chart"></i> Program Attainments
                </a>
                <a href="co-po.html" class="nav-item">
                    <i data-lucide="network"></i> CO/PO Mapping
                </a>
            </nav>

            
            <div style="margin-top: auto; padding: 1rem 0;">
                <button class="btn btn-secondary" style="width: 100%; justify-content: flex-start; gap: 0.5rem;" onclick="logout()">
                    <i data-lucide="log-out"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <div>
                    <h1 class="animate-fade-in text-gradient">Add New Assessment</h1>
                    <p style="color: var(--text-secondary)" class="animate-fade-in">Fill out the form below to add a new record.</p>
                </div>
                <a href="assessments.html" class="btn btn-secondary animate-fade-in">
                    <i data-lucide="arrow-left"></i> Back
                </a>
            </header>

            <div class="card animate-fade-in" style="animation-delay: 0.1s; ">
                <form id="addAssessmentForm" onsubmit="handleAddAssessment(event)">
                    <div class="form-group">
                        <label class="input-label">Assessment Name</label>
                        <input type="text" id="aName" class="input-field" required>
                    </div>
                    <div class="form-group">
                        <label class="input-label">Type</label>
                        <select id="aType" class="input-field" required>
                            <option value="">Select Type...</option>
                            <option value="Internal">Internal (e.g. FA, SA, ST1)</option>
                            <option value="External">External (e.g. ETE)</option>
                        </select>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label class="input-label">Max Marks</label>
                            <input type="number" id="aMarks" class="input-field" min="1" required>
                        </div>
                        <div class="form-group">
                            <label class="input-label">Weightage (%)</label>
                            <input type="number" id="aWeightage" class="input-field" min="1" max="100" step="0.1" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="input-label">Course</label>
                        <select id="aCourse" class="input-field" required>
                            <option value="">Select Course...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="input-label">Section (Optional)</label>
                        <select id="aSection" class="input-field">
                            <option value="">All Sections</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script>
        lucide.createIcons();

        async function fetchDropdowns() {
            const courseRes = await apiCall('courses.php');
            const secRes = await apiCall('sections.php');
            
            if (courseRes.success) {
                const s = document.getElementById('aCourse');
                courseRes.data.forEach(c => {
                    const o = document.createElement('option');
                    o.value = c.id; o.textContent = `${c.code} - ${c.name}`;
                    s.appendChild(o);
                });
            }
            if (secRes.success) {
                const s = document.getElementById('aSection');
                secRes.data.forEach(sec => {
                    const o = document.createElement('option');
                    o.value = sec.id; o.textContent = sec.name;
                    s.appendChild(o);
                });
            }
        }

        async function handleAddAssessment(e) {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.innerHTML = 'Saving...'; btn.disabled = true;

            const res = await apiCall('assessments.php', {
                method: 'POST',
                body: JSON.stringify({
                    courseId: document.getElementById('aCourse').value,
                    sectionId: document.getElementById('aSection').value,
                    name: document.getElementById('aName').value,
                    type: document.getElementById('aType').value,
                    maxMarks: parseInt(document.getElementById('aMarks').value),
                    weightage: parseFloat(document.getElementById('aWeightage').value)
                })
            });

            if (res.success) {
                showToast(res.message, 'success');
                setTimeout(() => window.location.href = 'assessments.html', 1000);
            } else {
                showToast(res.message, 'error');
                btn.innerHTML = 'Save'; btn.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', fetchDropdowns);
    </script>
</body>
</html>
